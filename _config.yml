title: netminn012のホームページ
description: Discoedや旧Twitter、Scratchなどにいるただのネット民でーす
url: "https://netminn012.com"
baseurl: ""
markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

exclude:
