<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webプロキシ</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
.bar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #8884;font-size:13px;flex-wrap:wrap}
.bar .grow{flex:1;word-break:break-all;opacity:.8}
button{padding:6px 10px;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit;cursor:pointer}
iframe{flex:1;border:0;width:100%}
#setup{max-width:560px;margin:8vh auto;padding:0 16px;display:none}
#setup input{width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid #8886;margin:8px 0}
#setup button{background:#2563eb;color:#fff;border-color:#2563eb;width:100%;padding:11px;font-size:15px}
</style>
</head>
<body>
<div class="bar">
<strong>Webプロキシ</strong>
<span class="grow" id="backendLabel">接続先を確認中…</span>
<button id="changeBtn" type="button">接続先を変更</button>
<a id="directLink" href="#" target="_blank" rel="noopener">直接開く</a>
</div>
<div id="setup">
<h1 style="font-size:19px">接続先（バックエンド）の設定</h1>
<p style="font-size:14px;line-height:1.6">通常は同じ場所に置かれた <code>backend.txt</code> から自動で読み込むので、入力は不要です。読み込めない場合だけ、バックエンドのURLを貼ってください（例: https://xxxx.serveousercontent.com）。</p>
<input id="backendInput" placeholder="https://…">
<button id="saveBtn" type="button">保存して接続</button>
<p id="setupMsg" style="font-size:13px;color:#dc2626"></p>
</div>
<iframe id="view" title="web proxy" style="display:none"></iframe>
<script>
var view = document.getElementById('view');
var setupEl = document.getElementById('setup');
var label = document.getElementById('backendLabel');
var qs = new URLSearchParams(location.search);
var qu = qs.get('u');

function connect(base) {
  base = (base || '').trim().replace(/\/+$/, '');
  if (!base) { showSetup('接続先が空です'); return; }
  label.textContent = '接続先: ' + base;
  document.getElementById('directLink').href = base + '/';
  setupEl.style.display = 'none';
  view.style.display = 'block';
  view.src = base + '/' + (qu ? '?u=' + encodeURIComponent(qu) : '');
}
function showSetup(msg) {
  view.style.display = 'none';
  setupEl.style.display = 'block';
  if (msg) document.getElementById('setupMsg').textContent = msg;
  var saved = '';
  try { saved = localStorage.getItem('px_backend_url') || ''; } catch (e) {}
  document.getElementById('backendInput').value = saved;
}
document.getElementById('saveBtn').addEventListener('click', function () {
  var v = document.getElementById('backendInput').value.trim();
  if (!/^https:\/\//i.test(v)) { showSetup('https:// で始まるURLを入れてください'); return; }
  try { localStorage.setItem('px_backend_url', v); } catch (e) {}
  connect(v);
});
document.getElementById('changeBtn').addEventListener('click', function () { showSetup(); });

fetch('backend.txt', { cache: 'no-store' }).then(function (r) {
  if (!r.ok) throw new Error('no backend.txt');
  return r.text();
}).then(function (t) {
  var url = (t || '').trim().split(/\s+/)[0];
  if (!/^https:\/\//i.test(url)) throw new Error('bad backend.txt');
  try { localStorage.setItem('px_backend_url', url); } catch (e) {}
  connect(url);
}).catch(function () {
  var saved = '';
  try { saved = localStorage.getItem('px_backend_url') || ''; } catch (e) {}
  if (saved) connect(saved); else showSetup();
});
</script>
</body>
</html>
