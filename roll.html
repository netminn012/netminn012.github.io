<!DOCTYPE html>

    .roll-page { min-height: 100vh; padding: 48px 0; text-align: center; }
    .roll-title { margin: 0 0 24px; color: var(--accent-cyan); font-size: clamp(2.2rem, 8vw, 5rem); line-height: 1.1; }
    .roll-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: center; }
    .roll-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 24px; }
    .roll-page img, .roll-video { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-secondary); }
    .roll-video { aspect-ratio: 16 / 9; overflow: hidden; }
    .roll-video iframe { width: 100%; height: 100%; border: 0; }
    @media (min-width: 760px) { .roll-grid { grid-template-columns: 1fr 1fr; } }
  </style>
